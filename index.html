<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>brain</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#efefed;--fg:#37352f;--fg2:#787774;--fg3:#b4b4b0;
  --line:#e9e9e7;--line2:#dedede;--accent:#2e6f95;--accent-bg:#e7f0f6;--danger:#c0392b;
  --c-gray:#ededeb;--c-gray-fg:#5c5c58;--c-blue:#e3ecf7;--c-blue-fg:#2a5285;--c-green:#e4f2e8;--c-green-fg:#2a6b40;
  --c-yellow:#fbf3db;--c-yellow-fg:#8a6a00;--c-red:#fae4e2;--c-red-fg:#9a2f26;--c-purple:#ece6f6;--c-purple-fg:#5a3f8a;--c-orange:#fbead9;--c-orange-fg:#8f4d12;
  --radius:6px;--sans:Pretendard,-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#191919;--bg2:#202020;--bg3:#282828;--fg:#e6e6e6;--fg2:#9b9b9b;--fg3:#5f5f5f;
  --line:#2f2f2f;--line2:#3a3a3a;--accent:#7fb3d3;--accent-bg:#1f2e38;--danger:#e06b60;
  --c-gray:#2b2b2b;--c-gray-fg:#b0b0b0;--c-blue:#1e2b3d;--c-blue-fg:#8fb4e0;--c-green:#1e3326;--c-green-fg:#8ccfa2;
  --c-yellow:#3d3418;--c-yellow-fg:#e2c35f;--c-red:#3d2220;--c-red-fg:#e89a92;--c-purple:#2c2440;--c-purple-fg:#b9a3e6;--c-orange:#3d2a18;--c-orange-fg:#e6a56a;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.c-gray{background:var(--c-gray);color:var(--c-gray-fg)}.c-blue{background:var(--c-blue);color:var(--c-blue-fg)}.c-green{background:var(--c-green);color:var(--c-green-fg)}
.c-yellow{background:var(--c-yellow);color:var(--c-yellow-fg)}.c-red{background:var(--c-red);color:var(--c-red-fg)}.c-purple{background:var(--c-purple);color:var(--c-purple-fg)}.c-orange{background:var(--c-orange);color:var(--c-orange-fg)}

/* ---------- 상단 ---------- */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;flex-wrap:wrap}
.bar .title{font-weight:600;margin-right:6px}
.tabs{display:flex;gap:2px;background:var(--bg2);border-radius:var(--radius);padding:2px}
.tabs button{padding:4px 10px;border-radius:4px;color:var(--fg2)}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--fg2);font-size:13px}
.pill select{border:0;background:transparent;padding:0;font-size:13px;color:var(--fg);max-width:120px}
.pill select:focus{outline:none}
input.search{padding:5px 9px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);min-width:110px}
.icon{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);color:var(--fg2)}
.icon:hover{background:var(--bg2);color:var(--fg)}
.views{display:flex;gap:4px;padding:0 12px 8px;flex-wrap:wrap;align-items:center}
.views button{padding:3px 10px;border-radius:14px;font-size:13px;color:var(--fg2);border:1px solid transparent}
.views button:hover{background:var(--bg2)}
.views button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.views .save{color:var(--accent);border-color:var(--line)}
.quick{display:flex;gap:6px;padding:0 12px 10px}
.quick input{flex:1;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--bg2)}
.quick input:focus{background:var(--bg);border-color:var(--accent);outline:none}
.quick button{padding:0 12px;border-radius:var(--radius);background:var(--fg);color:var(--bg);font-weight:500}
.quick button:disabled{opacity:.4;cursor:default}

/* ---------- 본문 ---------- */
main{padding:0 12px 80px;min-height:60vh}
.status{padding:28px 0;color:var(--fg2);text-align:center}
.status b{color:var(--fg)}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{color:var(--fg2);font-weight:500;font-size:12.5px;position:sticky;top:0;background:var(--bg);padding:7px 8px}
th button{color:inherit;display:inline-flex;gap:4px;align-items:center}
td.t{white-space:normal;min-width:180px;max-width:420px}
td.t button{text-align:left;font-weight:500;line-height:1.35}
td.t button:hover{text-decoration:underline}
tr:hover td{background:var(--bg2)}
.tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;line-height:18px;background:var(--bg2);color:var(--fg2);white-space:nowrap}
.inl{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:3px;padding:1px 7px;font-size:12px;line-height:18px;cursor:pointer;background:var(--bg2);color:var(--fg2);max-width:130px}
.inl:hover{border-color:var(--line2)}
.inl.empty{color:var(--fg3);background:transparent}
td input.inl{width:118px}
.due.late{color:var(--danger)}

/* 보드 */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 260px;background:var(--bg2);border-radius:8px;padding:8px;min-height:120px}
.col h3{margin:2px 4px 8px;font-size:13px;font-weight:500;color:var(--fg2);display:flex;justify-content:space-between;align-items:center}
.col h3 .tag{font-weight:500}
.col.over{outline:2px dashed var(--accent)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;cursor:grab;text-align:left;width:100%}
.card:active{cursor:grabbing}
.card .ct{font-weight:500;line-height:1.35}
.card .cm{margin-top:4px;font-size:12px;color:var(--fg2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card.dragging{opacity:.4}

/* 갤러리 */
.gallery{columns:3 240px;column-gap:10px}
.gcard{break-inside:avoid;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;width:100%;text-align:left;cursor:pointer}
.gcard .ct{font-weight:500;margin-bottom:4px}
.gcard .cb{font-size:13px;color:var(--fg2);white-space:pre-wrap;max-height:9em;overflow:hidden}
.gcard .cm{margin-top:6px;font-size:12px;color:var(--fg3)}

/* 할 일 */
.todos{max-width:760px}
.todos h3{font-size:13px;font-weight:500;color:var(--fg2);margin:18px 0 6px;display:flex;gap:8px;align-items:center}
.todos h3:first-child{margin-top:4px}
.todo{display:flex;align-items:flex-start;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line)}
.todo input{margin-top:4px;width:16px;height:16px;cursor:pointer}
.todo .tx{flex:1;line-height:1.4}
.todo .tx .src{display:block;font-size:12px;color:var(--fg3)}
.todo .tx .src button{color:var(--fg2)}
.todo .tx .src button:hover{text-decoration:underline}
.todo.done .tx{color:var(--fg3);text-decoration:line-through}
.todo .d{font-size:12px;color:var(--fg2);white-space:nowrap;padding-top:3px}
.todo .d.late{color:var(--danger)}

/* ---------- 패널 ---------- */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
.ph{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ph .path{font-size:12px;color:var(--fg2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{flex:1;overflow:auto;padding:12px 16px}
.pb input.ti{width:100%;font-size:20px;font-weight:600;border:0;padding:4px 0 10px;background:transparent}
.pb input.ti:focus{outline:none}
.props{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;font-size:13px;margin-bottom:12px}
.props label{color:var(--fg2);padding-top:4px}
.props select,.props input{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg2);max-width:220px}
.pb textarea{width:100%;min-height:50vh;border:1px solid var(--line);border-radius:var(--radius);padding:10px;background:var(--bg);resize:vertical;font-family:var(--sans);line-height:1.6}
.preview{border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;min-height:50vh;line-height:1.65}
.preview h1,.preview h2,.preview h3{margin:.8em 0 .3em;line-height:1.3}
.preview ul{padding-left:1.2em}.preview code{background:var(--bg2);padding:1px 4px;border-radius:3px;font-size:.9em}
.preview a.wl{text-decoration:none;border-bottom:1px solid var(--accent)}
.pf{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.pf .sp{font-size:12px;color:var(--fg2)}
.btn{padding:6px 12px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--bg)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.dim{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:9;display:none}
.dim.on{display:block}

/* ---------- 설정 ---------- */
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--bg);border-radius:10px;width:min(520px,100%);border:1px solid var(--line);max-height:92vh;display:flex;flex-direction:column}
.modal .mh{display:flex;gap:2px;padding:10px 14px 0;border-bottom:1px solid var(--line)}
.modal .mh button{padding:6px 10px;color:var(--fg2);border-bottom:2px solid transparent;margin-bottom:-1px}
.modal .mh button[aria-selected=true]{color:var(--fg);border-color:var(--fg)}
.modal .mb{padding:14px 16px;overflow:auto}
.modal h2{margin:0 0 6px;font-size:17px}
.modal p{margin:0 0 12px;color:var(--fg2);font-size:13px}
.modal label{display:block;font-size:13px;color:var(--fg2);margin:10px 0 4px}
.modal input.w{width:100%;padding:7px 9px;border:1px solid var(--line2);border-radius:var(--radius);background:var(--bg2)}
.modal .row{display:flex;gap:6px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.optlist{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.opt{display:flex;gap:6px;align-items:center}
.opt input{flex:1;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg2);min-width:0}
.opt input.id{flex:0 0 100px;font-family:ui-monospace,monospace;font-size:12px}
.opt select{padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg2)}
.opt .x{color:var(--fg3)}.opt .x:hover{color:var(--danger)}
/* 링크 */
.links{margin-top:14px;font-size:13px;color:var(--fg2)}
.links h4{margin:10px 0 4px;font-size:12px;font-weight:500;color:var(--fg3)}
.links button{display:inline-block;margin:0 6px 4px 0;padding:2px 8px;border:1px solid var(--line);border-radius:12px;color:var(--fg)}
.links button:hover{background:var(--bg2)}
/* 팔레트 */
.pal{align-items:flex-start;padding-top:12vh}
.pal .box{max-height:70vh}
.pal input.w{border:0;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;padding:12px 16px;font-size:16px;background:var(--bg)}
.pal input.w:focus{outline:none}
.pallist{overflow:auto;padding:6px}
.pallist button{display:flex;width:100%;text-align:left;padding:7px 10px;border-radius:var(--radius);gap:8px;align-items:center}
.pallist button[aria-selected=true],.pallist button:hover{background:var(--bg2)}
.pallist .k{font-size:12px;color:var(--fg3);flex:0 0 auto}
.pallist .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pallist .sec{font-size:11px;color:var(--fg3);padding:8px 10px 2px}
.qbadge{font-size:11px;padding:2px 7px;border-radius:10px;background:var(--c-yellow);color:var(--c-yellow-fg)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:var(--radius);font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:opacity .15s}
.toast.on{opacity:1}
@media (max-width:640px){
  .bar .title{display:none}
  .tabs button{padding:4px 8px}
  td.t{min-width:140px}
  .col{flex-basis:220px}
  .hide-m{display:none}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="title">brain</span>
    <div class="tabs" role="tablist">
      <button role="tab" data-view="table" aria-selected="true">표</button>
      <button role="tab" data-view="board">보드</button>
      <button role="tab" data-view="gallery">갤러리</button>
      <button role="tab" data-view="todo">할 일</button>
    </div>
    <span class="pill" data-f>폴더 <select id="fFolder"><option value="">전체</option></select></span>
    <span class="pill" data-f>상태 <select id="fStatus"><option value="">전체</option></select></span>
    <span class="pill" data-f>라벨 <select id="fLabel"><option value="">전체</option></select></span>
    <span class="pill" id="pillGroup">그룹 <select id="fGroup"><option value="status">상태</option><option value="label">라벨</option><option value="type">종류</option><option value="folder">폴더</option></select></span>
    <input class="search" id="q" type="search" placeholder="검색" aria-label="검색">
    <span class="sp"></span>
    <button class="icon" id="btnPalette" title="명령 (Ctrl+K)" aria-label="명령">⌘</button>
    <button class="icon" id="btnReload" title="새로고침" aria-label="새로고침">↻</button>
    <span class="qbadge" id="qbadge" hidden></span>
    <button class="icon" id="btnSettings" title="설정" aria-label="설정">⚙</button>
  </div>
  <div class="views" id="views"></div>
  <form class="quick" id="quick">
    <input id="quickText" placeholder="메모 적고 Enter — 00_Inbox에 저장" autocomplete="off">
    <button type="submit" id="quickBtn">추가</button>
  </form>
</header>

<main id="main"><div class="status">불러오는 중…</div></main>

<div class="dim" id="dim"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="ph">
    <button class="icon" id="pClose" aria-label="닫기">✕</button>
    <span class="path" id="pPath"></span>
    <button class="btn sm" id="pToggle">미리보기</button>
  </div>
  <div class="pb">
    <input class="ti" id="pTitle" placeholder="제목" aria-label="제목">
    <div class="props">
      <label for="pStatus">상태</label><select id="pStatus"></select>
      <label for="pLabel">라벨</label><select id="pLabel"></select>
      <label for="pDue">마감</label><input id="pDue" type="date">
      <label>종류</label><span id="pType" style="padding-top:4px;color:var(--fg2)"></span>
    </div>
    <textarea id="pBody" spellcheck="false" aria-label="본문"></textarea>
    <div class="preview" id="pPreview" hidden></div>
    <div class="links" id="pLinks"></div>
  </div>
  <div class="pf">
    <button class="btn danger" id="pDelete">삭제</button>
    <span class="sp" id="pMsg"></span>
    <button class="btn primary" id="pSave">저장</button>
  </div>
</aside>

<div class="modal" id="settings">
  <div class="box">
    <div class="mh" role="tablist">
      <button role="tab" data-tab="conn" aria-selected="true">연결</button>
      <button role="tab" data-tab="props">속성</button>
      <button role="tab" data-tab="views">저장된 뷰</button>
    </div>
    <div class="mb" data-tab="conn">
      <h2>연결 설정</h2>
      <p>GitHub 저장소에 직접 읽고 씁니다. 토큰은 이 브라우저에만 저장됩니다.</p>
      <label for="sRepo">저장소</label><input class="w" id="sRepo" placeholder="harangon/drbrain">
      <label for="sBranch">브랜치</label><input class="w" id="sBranch" placeholder="main">
      <label for="sToken">Fine-grained 토큰 (Contents 읽기·쓰기)</label><input class="w" id="sToken" type="password" placeholder="github_pat_…">
    </div>
    <div class="mb" data-tab="props" hidden>
      <h2>상태</h2>
      <p>id는 프론트매터에 저장되는 값(영문), 이름은 화면 표시용. 순서가 보드 열 순서입니다.</p>
      <div class="optlist" id="optStatus"></div>
      <button class="btn sm" id="addStatus">+ 상태 추가</button>
      <h2 style="margin-top:18px">라벨</h2>
      <div class="optlist" id="optLabel"></div>
      <button class="btn sm" id="addLabel">+ 라벨 추가</button>
      <p style="margin-top:14px">저장하면 볼트의 <code>_scripts/brain.config.json</code>에 커밋됩니다. Claude Code의 CLAUDE.md도 이 파일을 참조합니다.</p>
    </div>
    <div class="mb" data-tab="views" hidden>
      <h2>저장된 뷰</h2>
      <p>뷰 종류·폴더·상태·라벨·그룹·정렬·검색어 조합을 이름으로 저장한 것입니다. 상단 뷰 줄에서 "현재 뷰 저장"으로 추가합니다.</p>
      <div class="optlist" id="optViews"></div>
    </div>
    <div class="row"><button class="btn" id="sCancel">닫기</button><button class="btn primary" id="sSave">저장</button></div>
  </div>
</div>
<div class="modal pal" id="palette">
  <div class="box">
    <input class="w" id="palInput" placeholder="노트 검색, 또는 > 명령" autocomplete="off" aria-label="명령 팔레트">
    <div class="pallist" id="palList" role="listbox"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ===================== 상수·상태 ===================== */
const LS='brain.cfg', CONFIG_PATH='_scripts/brain.config.json';
const FOLDERS=['00_Inbox','01_Daily','10_Projects','20_Areas','30_Resources','40_Notes','50_MOC','90_Archive'];
const COLORS=['gray','blue','green','yellow','red','purple','orange'];
const DEFAULT_CONFIG={
  statuses:[{id:'active',name:'진행',color:'blue'},{id:'paused',name:'보류',color:'yellow'},{id:'done',name:'완료',color:'green'},{id:'archived',name:'보관',color:'gray'}],
  labels:[{id:'idea',name:'아이디어',color:'yellow'},{id:'todo',name:'할 일',color:'blue'},{id:'read',name:'읽을 것',color:'green'},{id:'work',name:'업무',color:'gray'}],
  views:[
    {id:'inbox',name:'Inbox',view:'gallery',folder:'00_Inbox',status:'',label:'',group:'status',sort:'updated:-1',q:''},
    {id:'projects',name:'활성 프로젝트',view:'table',folder:'10_Projects',status:'active',label:'',group:'status',sort:'due:1',q:''},
    {id:'board',name:'프로젝트 보드',view:'board',folder:'10_Projects',status:'',label:'',group:'status',sort:'updated:-1',q:''},
  ]
};
let cfg=JSON.parse(localStorage.getItem(LS)||'null')||{repo:'harangon/drbrain',branch:'main',token:''};
let config=structuredClone(DEFAULT_CONFIG), configSha=null;
let notes=[];
let state={view:'table',folder:'',status:'',label:'',group:'status',sort:'updated:-1',q:'',saved:''};
try{Object.assign(state,JSON.parse(localStorage.getItem('brain.state')||'{}'));}catch{}
let current=null;

/* ===================== GitHub API ===================== */
const api={
  async req(p,opt={}){
    if(!cfg.token)throw new Error('토큰 없음');
    const r=await fetch('https://api.github.com'+p,{...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
    if(r.status===404&&opt.allow404)return null;
    if(!r.ok){let m='';try{m=(await r.json()).message||'';}catch{}throw new Error(`GitHub ${r.status} ${m}`);}
    return r.status===204?null:r.json();
  },
  tree(){return api.req(`/repos/${cfg.repo}/git/trees/${cfg.branch}?recursive=1`);},
  async file(path,allow404){const j=await api.req(`/repos/${cfg.repo}/contents/${encodeURI(path)}?ref=${cfg.branch}`,{allow404});return j?{sha:j.sha,content:b64dec(j.content)}:null;},
  put(path,content,sha,message){return api.req(`/repos/${cfg.repo}/contents/${encodeURI(path)}`,{method:'PUT',body:JSON.stringify({message,content:b64enc(content),branch:cfg.branch,...(sha?{sha}:{})})});},
  del(path,sha,message){return api.req(`/repos/${cfg.repo}/contents/${encodeURI(path)}`,{method:'DELETE',body:JSON.stringify({message,sha,branch:cfg.branch})});},
};
const b64enc=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const isNetErr=e=>e instanceof TypeError||/Failed to fetch|NetworkError|Load failed/.test(String(e.message));
const isConflict=e=>/GitHub 409|GitHub 422/.test(String(e.message));

/* ===================== 오프라인 큐 ===================== */
// 네트워크가 없을 때 쓰기를 쌓아 두고, 연결되면 순서대로 반영한다. 항목: {op:'put'|'del', path, content?, message}
const queue={
  list:JSON.parse(localStorage.getItem('brain.queue')||'[]'),
  save(){localStorage.setItem('brain.queue',JSON.stringify(queue.list));queue.badge();},
  badge(){const b=$('#qbadge');b.hidden=!queue.list.length;b.textContent=`대기 ${queue.list.length}`;b.title='오프라인에서 저장한 변경. 연결되면 자동 반영';},
  push(item){const i=queue.list.findIndex(x=>x.path===item.path);if(i>=0)queue.list.splice(i,1);queue.list.push(item);queue.save();},
  async flush(){
    if(!queue.list.length||!navigator.onLine||queue.busy)return;queue.busy=true;let ok=0;
    try{
      while(queue.list.length){const it=queue.list[0];
        const cur=await api.file(it.path,true);
        if(it.op==='put'){const r=await api.put(it.path,it.content,cur?cur.sha:null,it.message);const n=notes.find(x=>x.path===it.path);if(n)n.sha=r.content.sha;}
        else if(cur)await api.del(it.path,cur.sha,it.message);
        queue.list.shift();queue.save();ok++;}
      if(ok)toast(`오프라인 변경 ${ok}건을 반영했습니다`);
    }catch(e){if(!isNetErr(e))toast('대기 변경 반영 실패: '+e.message,4000);}
    queue.busy=false;saveCache();
  }
};
window.addEventListener('online',()=>queue.flush());

/* ===================== 마크다운 / 프론트매터 ===================== */
function parseFM(raw){
  const m=raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  const fm={};let body=raw;
  if(m){body=raw.slice(m[0].length);
    for(const line of m[1].split(/\r?\n/)){const i=line.indexOf(':');if(i<1)continue;
      const k=line.slice(0,i).trim();let v=line.slice(i+1).trim();
      if(v.startsWith('[')&&v.endsWith(']'))v=v.slice(1,-1).split(',').map(s=>s.trim().replace(/^["']|["']$/g,'')).filter(Boolean);
      else if(v==='true')v=true;else if(v==='false')v=false;else v=v.replace(/^["']|["']$/g,'');
      fm[k]=v;}}
  return{fm,body};
}
function buildFM(fm){
  const lines=[];
  for(const[k,v]of Object.entries(fm)){if(v===''||v===undefined||v===null)continue;
    if(Array.isArray(v))lines.push(`${k}: [${v.join(', ')}]`);else lines.push(`${k}: ${v}`);}
  return lines.length?`---\n${lines.join('\n')}\n---\n`:'';
}
function titleOf(path,body){const h=body.match(/^#\s+(.+)$/m);if(h)return h[1].trim();return path.split('/').pop().replace(/\.md$/,'');}
function slug(s){return s.trim().replace(/[\\/:*?"<>|#\[\]]/g,'').replace(/\s+/g,'-').slice(0,60)||'메모';}
function mdToHtml(md){
  let h=esc(md);
  h=h.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${c}</code></pre>`);
  h=h.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>');
  h=h.replace(/^- \[([ xX])\] (.*)$/gm,(_,c,t)=>`<li><input type="checkbox" disabled ${c.trim()?'checked':''}> ${t}</li>`);
  h=h.replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>\n?)+/g,m=>`<ul>${m.replace(/\n/g,'')}</ul>\n`);
  h=h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(_,t,a)=>`<a class="wl" href="#" data-wl="${t}">${a||t}</a>`);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  h=h.replace(/&lt;!--[\s\S]*?--&gt;/g,'');
  h=h.replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  return `<p>${h}</p>`.replace(/(<br>)+(<(?:h[123]|ul|pre)>)/g,'$2').replace(/(<\/(?:h[123]|ul|pre)>)(<br>)+/g,'$1')
    .replace(/<p>(<(?:h[123]|ul|pre)>)/g,'$1').replace(/(<\/(?:h[123]|ul|pre)>)<\/p>/g,'$1').replace(/<p>(<br>)*<\/p>/g,'');
}
// 할 일 줄 파싱: "- [ ] 내용 📅 2026-11-12 #project/x"
const TODO_RE=/^(\s*)- \[([ xX])\] (.*)$/;
function parseTodo(line){const m=line.match(TODO_RE);if(!m)return null;const text=m[3];const d=text.match(/📅\s*(\d{4}-\d{2}-\d{2})/);return{done:m[2].trim()!=='',text:text.replace(/\s*✅\s*\d{4}-\d{2}-\d{2}/,'').trim(),due:d?d[1]:''};}

/* ===================== 설정 파일 ===================== */
async function loadConfig(){
  try{const f=await api.file(CONFIG_PATH,true);
    if(f){const j=JSON.parse(f.content);config={...structuredClone(DEFAULT_CONFIG),...j};configSha=f.sha;}
    else{config=structuredClone(DEFAULT_CONFIG);configSha=null;}
  }catch(e){toast('설정 파일을 읽지 못해 기본값을 씁니다');}
  localStorage.setItem('brain.config',JSON.stringify(config));
  applyConfig();
}
async function saveConfig(){
  const content=JSON.stringify(config,null,2)+'\n';
  const r=await api.put(CONFIG_PATH,content,configSha,'web: 설정 변경');
  configSha=r.content.sha;localStorage.setItem('brain.config',JSON.stringify(config));applyConfig();
}
function applyConfig(){
  const fill=(sel,list,first)=>{const s=$(sel);const cur=s.value;s.innerHTML='';s.append(el('option',{value:''},first));for(const o of list)s.append(el('option',{value:o.id},o.name));s.value=list.some(o=>o.id===cur)?cur:'';};
  fill('#fStatus',config.statuses,'전체');fill('#fLabel',config.labels,'전체');
  fill('#pStatus',config.statuses,'—');fill('#pLabel',config.labels,'—');
  renderViews();
}

/* ===================== 로드 ===================== */
async function load(){
  $('#main').innerHTML='<div class="status">불러오는 중…</div>';
  try{
    await loadConfig();
    const t=await api.tree();
    const paths=t.tree.filter(x=>x.type==='blob'&&x.path.endsWith('.md')&&FOLDERS.some(f=>x.path.startsWith(f+'/'))).map(x=>x.path);
    const cache=JSON.parse(localStorage.getItem('brain.cache')||'{}');
    const shaOf=Object.fromEntries(t.tree.map(x=>[x.path,x.sha]));
    const out=[];const need=[];
    for(const p of paths){const c=cache[p];if(c&&c.sha===shaOf[p])out.push(c);else need.push(p);}
    let done=0;
    for(let i=0;i<need.length;i+=8){
      await Promise.all(need.slice(i,i+8).map(async p=>{const f=await api.file(p);const{fm,body}=parseFM(f.content);
        out.push({path:p,sha:f.sha,raw:f.content,fm,body,title:titleOf(p,body),folder:p.split('/')[0]});done++;}));
      if(need.length>16)$('#main').innerHTML=`<div class="status">불러오는 중… <b>${done}/${need.length}</b></div>`;
    }
    notes=out;saveCache();fillFolders();restoreControls();render();queue.badge();queue.flush();
  }catch(e){
    const cache=JSON.parse(localStorage.getItem('brain.cache')||'{}');
    if(isNetErr(e)&&Object.keys(cache).length){notes=Object.values(cache);fillFolders();restoreControls();render();queue.badge();toast('오프라인 — 마지막으로 받은 내용을 보여줍니다',3000);return;}
    $('#main').innerHTML=`<div class="status">불러오지 못했습니다.<br><b>${esc(e.message)}</b><br><br>저장소 이름, 브랜치, 토큰 권한(Contents 읽기·쓰기)을 확인하세요.</div>`;
  }
}
function fillFolders(){
  const s=$('#fFolder');const cur=s.value;s.innerHTML='<option value="">전체</option>';
  for(const f of FOLDERS){const n=notes.filter(x=>x.folder===f).length;if(n)s.append(el('option',{value:f},`${f} (${n})`));}
  s.value=cur;
}
function restoreControls(){$('#fFolder').value=state.folder;$('#fStatus').value=state.status;$('#fLabel').value=state.label;$('#fGroup').value=state.group;$('#q').value=state.q;}
function readControls(){state.folder=$('#fFolder').value;state.status=$('#fStatus').value;state.label=$('#fLabel').value;state.group=$('#fGroup').value;state.q=$('#q').value;}

/* ===================== 저장된 뷰 ===================== */
function renderViews(){
  const v=$('#views');v.innerHTML='';
  v.append(el('button',{'aria-pressed':state.saved===''?'true':'false',onclick:()=>applyView(null)},'전체'));
  for(const sv of config.views)v.append(el('button',{'aria-pressed':state.saved===sv.id?'true':'false',onclick:()=>applyView(sv)},sv.name));
  v.append(el('button',{class:'save',onclick:saveCurrentView},'+ 현재 뷰 저장'));
}
function applyView(sv){
  if(sv){Object.assign(state,{view:sv.view,folder:sv.folder||'',status:sv.status||'',label:sv.label||'',group:sv.group||'status',sort:sv.sort||'updated:-1',q:sv.q||'',saved:sv.id});}
  else Object.assign(state,{folder:'',status:'',label:'',q:'',saved:''});
  restoreControls();saveState();render();
}
async function saveCurrentView(){
  readControls();const name=prompt('뷰 이름',state.saved?(optOf(config.views,state.saved)||{}).name:'');if(!name)return;
  const id=state.saved||('v'+Date.now().toString(36));
  const sv={id,name,view:state.view,folder:state.folder,status:state.status,label:state.label,group:state.group,sort:state.sort,q:state.q};
  const i=config.views.findIndex(x=>x.id===id);if(i>=0)config.views[i]=sv;else config.views.push(sv);
  state.saved=id;saveState();
  try{await saveConfig();toast('뷰를 저장했습니다');}catch(e){toast('저장 실패: '+e.message,4000);}
}

/* ===================== 필터·정렬 ===================== */
function visible(){
  readControls();
  const{folder:f,status:st,label:lb}=state,q=state.q.trim().toLowerCase();
  let v=notes.filter(n=>(!f||n.folder===f)&&(!st||n.fm.status===st)&&(!lb||n.fm.label===lb)&&(!q||(n.title+n.body+JSON.stringify(n.fm)).toLowerCase().includes(q)));
  const[k,d]=state.sort.split(':');const dir=+d||1;
  v.sort((a,b)=>{const x=val(a,k),y=val(b,k);if(x===''&&y!=='')return 1;if(y===''&&x!=='')return -1;return (x<y?-1:x>y?1:0)*dir;});
  return v;
}
function val(n,k){if(k==='title')return n.title;if(k==='folder')return n.folder;if(k==='updated')return n.fm.updated||n.fm.created||'';return n.fm[k]??'';}

/* ===================== 렌더 ===================== */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===state.view));
  $('#pillGroup').style.display=state.view==='board'?'':'none';
  document.querySelectorAll('[data-f]').forEach(p=>p.style.display=(state.view==='todo'&&!p.contains($('#fFolder')))?'none':'');
  renderViews();saveState();
  const m=$('#main');m.innerHTML='';
  if(!notes.length){m.append(el('div',{class:'status'},'노트가 없습니다. 위 입력창에 첫 메모를 적어 보세요.'));return;}
  if(state.view==='todo')return renderTodo(m);
  const v=visible();
  if(!v.length){m.append(el('div',{class:'status'},'조건에 맞는 노트가 없습니다.'));return;}
  ({table:renderTable,board:renderBoard,gallery:renderGallery})[state.view](v,m);
}
function tagEl(o,fallback){return o?el('span',{class:'tag c-'+(o.color||'gray')},o.name):(fallback?el('span',{class:'tag'},fallback):'');}
function statusTag(n){return n.fm.status?tagEl(statusOpt(n.fm.status),n.fm.status):'';}
function labelTag(n){return n.fm.label?tagEl(labelOpt(n.fm.label),n.fm.label):'';}
function dueEl(n){if(!n.fm.due)return'';const late=n.fm.due<today()&&n.fm.status!=='done';return el('span',{class:'due'+(late?' late':'')},n.fm.due);}
function inlineSelect(n,key,list){
  const cur=n.fm[key]||'';const o=optOf(list,cur);
  const s=el('select',{class:'inl'+(cur?' c-'+(o?o.color:'gray'):' empty'),'aria-label':key,onclick:e=>e.stopPropagation(),onchange:async e=>{await saveNote(n,{[key]:e.target.value});}});
  s.append(el('option',{value:''},'—'));for(const x of list)s.append(el('option',{value:x.id},x.name));
  s.value=list.some(x=>x.id===cur)?cur:'';return s;
}
function inlineDate(n){
  const late=n.fm.due&&n.fm.due<today()&&n.fm.status!=='done';
  const inp=el('input',{type:'date',class:'inl'+(late?' due late':''),value:n.fm.due||'','aria-label':'마감',onclick:e=>e.stopPropagation(),onchange:async e=>{await saveNote(n,{due:e.target.value});}});
  if(n.fm.due)return inp;
  const b=el('button',{class:'inl empty',onclick:e=>{e.stopPropagation();b.replaceWith(inp);inp.focus();inp.showPicker?.();}},'—');
  inp.addEventListener('blur',()=>{if(!inp.value)inp.replaceWith(b);});
  return b;
}
function renderTable(v,m){
  const cols=[['title','제목'],['folder','폴더'],['status','상태'],['label','라벨'],['due','마감'],['updated','수정']];
  const[sk,sd]=state.sort.split(':');
  const thead=el('tr',{},...cols.map(([k,t])=>el('th',{class:k==='updated'?'hide-m':''},el('button',{onclick:()=>{const d=sk===k?-sd:(k==='updated'?-1:1);state.sort=`${k}:${d}`;render();}},t,sk===k?(+sd>0?' ↑':' ↓'):''))));
  const rows=v.map(n=>el('tr',{},
    el('td',{class:'t'},el('button',{onclick:()=>openNote(n)},n.title)),
    el('td',{},n.folder.replace(/^\d+_/,'')),
    el('td',{},inlineSelect(n,'status',config.statuses)),el('td',{},inlineSelect(n,'label',config.labels)),el('td',{},inlineDate(n)),
    el('td',{class:'hide-m'},val(n,'updated'))));
  m.append(el('table',{},el('thead',{},thead),el('tbody',{},...rows)));
}
function renderBoard(v,m){
  const g=state.group;
  const keyOf=n=>g==='folder'?n.folder:(n.fm[g]||'');
  let keys;
  if(g==='status')keys=['',...config.statuses.map(s=>s.id)];
  else if(g==='label')keys=['',...config.labels.map(s=>s.id)];
  else keys=[...new Set(v.map(keyOf))].sort();
  const groups=Object.fromEntries(keys.map(k=>[k,[]]));
  for(const n of v){const k=keyOf(n);(groups[k]??=[]).push(n);}
  const board=el('div',{class:'board'});
  for(const[k,list]of Object.entries(groups)){
    if(!list.length&&k==='')continue;
    const o=g==='status'?statusOpt(k):g==='label'?labelOpt(k):null;
    const col=el('div',{class:'col',ondragover:e=>{if(g==='status'||g==='label'){e.preventDefault();col.classList.add('over');}},ondragleave:()=>col.classList.remove('over'),
      ondrop:async e=>{e.preventDefault();col.classList.remove('over');const p=e.dataTransfer.getData('text/plain');const n=notes.find(x=>x.path===p);if(!n||!(g==='status'||g==='label'))return;
        if((n.fm[g]||'')===k)return;await saveNote(n,{[g]:k});}},
      el('h3',{},k===''?el('span',{},'없음'):(o?tagEl(o):el('span',{},k)),el('span',{},String(list.length))));
    for(const n of list){
      const c=el('button',{class:'card',draggable:g==='status'||g==='label'?'true':null,onclick:()=>openNote(n),
        ondragstart:e=>{e.dataTransfer.setData('text/plain',n.path);c.classList.add('dragging');},ondragend:()=>c.classList.remove('dragging')},
        el('div',{class:'ct'},n.title),el('div',{class:'cm'},n.folder.replace(/^\d+_/,''),g!=='label'?labelTag(n):'',g!=='status'?statusTag(n):'',dueEl(n)));
      col.append(c);
    }
    board.append(col);
  }
  m.append(board);
}
function renderGallery(v,m){
  const gal=el('div',{class:'gallery'});
  for(const n of v){
    const body=n.body.replace(/^#\s+.*$/m,'').replace(/<!--[\s\S]*?-->/g,'')
      .replace(/^#{1,6}\s+/gm,'').replace(/^- \[([ xX])\] /gm,(_,c)=>c.trim()?'☑ ':'☐ ').replace(/^- /gm,'• ')
      .replace(/\[\[([^\]|]+)(?:\|[^\]]+)?\]\]/g,'$1').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\n{3,}/g,'\n\n').trim();
    const lo=labelOpt(n.fm.label);
    gal.append(el('button',{class:'gcard'+(lo?' c-'+lo.color:''),onclick:()=>openNote(n)},
      el('div',{class:'ct'},n.title),el('div',{class:'cb'},body.slice(0,400)),
      el('div',{class:'cm'},[n.folder.replace(/^\d+_/,''),(statusOpt(n.fm.status)||{}).name,n.fm.due].filter(Boolean).join(' · '))));
  }
  m.append(gal);
}
function renderTodo(m){
  readControls();const q=state.q.trim().toLowerCase(),f=state.folder;
  const items=[];
  for(const n of notes){if(f&&n.folder!==f)continue;const lines=n.body.split('\n');lines.forEach((ln,i)=>{const t=parseTodo(ln);if(t&&!t.done&&(!q||t.text.toLowerCase().includes(q)))items.push({...t,note:n,line:i});});}
  const td=today(),wk=addDays(td,7);
  const groups=[['지연',t=>t.due&&t.due<td],['오늘',t=>t.due===td],['7일 내',t=>t.due>td&&t.due<=wk],['이후',t=>t.due>wk],['날짜 없음',t=>!t.due]];
  const wrap=el('div',{class:'todos'});let total=0;
  for(const[name,f]of groups){
    const list=items.filter(f).sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1);if(!list.length)continue;total+=list.length;
    wrap.append(el('h3',{},name,el('span',{class:'tag'},String(list.length))));
    for(const t of list){
      const row=el('div',{class:'todo'},
        el('input',{type:'checkbox',onchange:async e=>{row.classList.add('done');await completeTodo(t.note,t.line);}}),
        el('div',{class:'tx'},t.text.replace(/📅\s*\d{4}-\d{2}-\d{2}/,'').trim(),el('span',{class:'src'},el('button',{onclick:()=>openNote(t.note)},t.note.title))),
        t.due?el('span',{class:'d'+(name==='지연'?' late':'')},t.due):'');
      wrap.append(row);
    }
  }
  if(!total)wrap.append(el('div',{class:'status'},'미완료 할 일이 없습니다. 형식: - [ ] 내용 📅 YYYY-MM-DD'));
  m.append(wrap);
}
async function completeTodo(n,lineIdx){
  const lines=n.body.split('\n');const ln=lines[lineIdx];const m=ln.match(TODO_RE);if(!m)return;
  lines[lineIdx]=`${m[1]}- [x] ${m[3]} ✅ ${today()}`;
  await saveNote(n,{},undefined,lines.join('\n').replace(/^#\s+.*\n?/m,''),true);
}

/* ===================== 패널 ===================== */
function openNote(n){
  current=n;
  $('#pPath').textContent=n.path;$('#pTitle').value=n.title;
  $('#pStatus').value=n.fm.status||'';$('#pLabel').value=n.fm.label||'';$('#pDue').value=n.fm.due||'';$('#pType').textContent=n.fm.type||'';
  $('#pBody').value=n.body.replace(/^#\s+.*\n?/m,'');$('#pMsg').textContent='';
  showPreview(false);renderLinks(n);
  $('#panel').classList.add('open');$('#panel').setAttribute('aria-hidden','false');$('#dim').classList.add('on');
  if(window.innerWidth>640)setTimeout(()=>$('#pBody').focus(),50);
}
const linkTargets=n=>[...new Set([...n.body.matchAll(/\[\[([^\]|#]+)/g)].map(m=>m[1].trim()).concat(Array.isArray(n.fm.related)?n.fm.related.map(s=>s.replace(/^\[\[|\]\]$/g,'').split('|')[0].trim()):[]))];
const findNote=name=>notes.find(x=>x.title===name||x.path.endsWith('/'+name+'.md')||x.path===name+'.md');
function renderLinks(n){
  const box=$('#pLinks');box.innerHTML='';
  const out=linkTargets(n);const back=notes.filter(x=>x!==n&&linkTargets(x).some(t=>findNote(t)===n));
  const mk=(name,target)=>el('button',{onclick:()=>target?openNote(target):toast('아직 없는 노트입니다')},name+(target?'':' (없음)'));
  if(out.length){box.append(el('h4',{},'이 노트가 가리키는 곳'));for(const t of out)box.append(mk(t,findNote(t)));}
  if(back.length){box.append(el('h4',{},'이 노트를 가리키는 노트'));for(const x of back)box.append(mk(x.title,x));}
}
function closePanel(){$('#panel').classList.remove('open');$('#panel').setAttribute('aria-hidden','true');$('#dim').classList.remove('on');current=null;}
function showPreview(on){
  $('#pBody').hidden=on;$('#pPreview').hidden=!on;$('#pToggle').textContent=on?'편집':'미리보기';
  if(on){$('#pPreview').innerHTML=mdToHtml($('#pBody').value);
    $('#pPreview').querySelectorAll('a.wl').forEach(a=>a.onclick=e=>{e.preventDefault();const t=notes.find(x=>x.title===a.dataset.wl||x.path.endsWith('/'+a.dataset.wl+'.md'));if(t)openNote(t);else toast('노트를 찾을 수 없습니다');});}
}
async function saveNote(n,patch,newTitle,newBody,quiet){
  const fm={...n.fm,...patch};fm.updated=today();
  const title=newTitle??n.title;const body=newBody??n.body.replace(/^#\s+.*\n?/m,'');
  const hasH1=/^#\s+/m.test(n.body)||newTitle!==undefined;
  const raw=buildFM(fm)+(hasH1?`# ${title}\n\n`:'')+body.replace(/^\n+/,'');
  if(current===n)$('#pMsg').textContent='저장 중…';
  const apply=sha=>{Object.assign(n,{sha,raw,fm,body:(hasH1?`# ${title}\n\n`:'')+body,title});saveCache();if(current===n)$('#pMsg').textContent='';render();};
  try{
    const r=await api.put(n.path,raw,n.sha,`web: ${title}`);
    apply(r.content.sha);if(!quiet)toast('저장했습니다');
  }catch(e){
    if(current===n)$('#pMsg').textContent='';
    if(isNetErr(e)){queue.push({op:'put',path:n.path,content:raw,message:`web: ${title}`});apply(n.sha);toast('오프라인 — 연결되면 반영됩니다');return;}
    if(isConflict(e)){
      // 다른 기기가 먼저 바꿈. 최신본을 받아 와서 sha를 맞추고, 사용자의 내용은 유지한 채 다시 저장하게 한다.
      try{const f=await api.file(n.path);n.sha=f.sha;const p=parseFM(f.content);
        if(current===n){toast('다른 기기에서 먼저 수정된 노트입니다. 다시 저장하면 지금 내용으로 덮어씁니다',5000);}
        else{Object.assign(n,{raw:f.content,fm:p.fm,body:p.body,title:titleOf(n.path,p.body)});saveCache();render();toast('다른 기기 변경을 받아왔습니다. 다시 시도하세요',4000);}
      }catch{toast('저장 실패: '+e.message,4000);}
      return;
    }
    toast('저장 실패: '+e.message,4000);render();
  }
}
$('#pSave').onclick=()=>{if(!current)return;saveNote(current,{status:$('#pStatus').value,label:$('#pLabel').value,due:$('#pDue').value},$('#pTitle').value.trim()||current.title,$('#pBody').value);};
$('#pDelete').onclick=async()=>{if(!current||!confirm(`"${current.title}" 노트를 삭제할까요?`))return;
  const n=current;const done=()=>{notes=notes.filter(x=>x!==n);saveCache();closePanel();fillFolders();render();};
  try{await api.del(n.path,n.sha,`web: 삭제 ${n.title}`);done();toast('삭제했습니다');}
  catch(e){if(isNetErr(e)){queue.push({op:'del',path:n.path,message:`web: 삭제 ${n.title}`});done();toast('오프라인 — 연결되면 삭제됩니다');}else toast('삭제 실패: '+e.message,4000);}};
$('#pClose').onclick=closePanel;$('#dim').onclick=closePanel;
$('#pToggle').onclick=()=>showPreview($('#pPreview').hidden);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current)closePanel();if((e.ctrlKey||e.metaKey)&&e.key==='s'&&current){e.preventDefault();$('#pSave').click();}});

/* ===================== 빠른 입력 ===================== */
$('#quick').onsubmit=async e=>{
  e.preventDefault();const text=$('#quickText').value.trim();if(!text)return;
  const first=text.split('\n')[0];const d=today();
  let path=`00_Inbox/${d}-${slug(first)}.md`;
  if(notes.some(n=>n.path===path))path=path.replace(/\.md$/,`-${Date.now().toString(36)}.md`);
  const fm={type:'inbox',created:d};const raw=buildFM(fm)+text+'\n';
  $('#quickBtn').disabled=true;
  const msg=`web: ${first.slice(0,40)}`;
  const add=sha=>{notes.unshift({path,sha,raw,fm,body:text+'\n',title:titleOf(path,text),folder:'00_Inbox'});saveCache();$('#quickText').value='';fillFolders();render();};
  try{const r=await api.put(path,raw,null,msg);add(r.content.sha);toast('Inbox에 저장했습니다');}
  catch(err){if(isNetErr(err)){queue.push({op:'put',path,content:raw,message:msg});add(null);toast('오프라인 — 연결되면 반영됩니다');}else toast('저장 실패: '+err.message,4000);}
  $('#quickBtn').disabled=false;
};

/* ===================== 템플릿으로 새 노트 ===================== */
const TEMPLATE_OF={'10_Projects':'Project','20_Areas':'Area','30_Resources':'Resource','40_Notes':'Permanent','50_MOC':'MOC'};
async function newFromTemplate(folder){
  const title=prompt(`${folder.replace(/^\d+_/,'')}에 새 노트 — 제목`);if(!title)return;
  const path=`${folder}/${slug(title)}.md`;if(notes.some(n=>n.path===path)){toast('같은 이름의 노트가 있습니다');return;}
  let raw;
  try{const t=await api.file(`_templates/${TEMPLATE_OF[folder]}.md`,true);
    raw=t?t.content.replace(/<%\s*tp\.date\.now\([^)]*\)\s*%>/g,today()).replace(/<%\s*tp\.file\.title\s*%>/g,title).replace(/<%[\s\S]*?%>/g,''):null;}
  catch{raw=null;}
  if(!raw)raw=buildFM({type:(TEMPLATE_OF[folder]||'note').toLowerCase(),status:'active',created:today(),updated:today()})+`# ${title}\n\n`;
  const{fm,body}=parseFM(raw);const n={path,sha:null,raw,fm,body,title,folder};
  try{const r=await api.put(path,raw,null,`web: 새 노트 ${title}`);n.sha=r.content.sha;}
  catch(e){if(isNetErr(e))queue.push({op:'put',path,content:raw,message:`web: 새 노트 ${title}`});else{toast('생성 실패: '+e.message,4000);return;}}
  notes.unshift(n);saveCache();fillFolders();render();openNote(n);
}

/* ===================== 설정 모달 ===================== */
function optRow(list,o,listEl){
  const row=el('div',{class:'opt'},
    el('input',{class:'id',value:o.id,placeholder:'id',oninput:e=>o.id=e.target.value.trim().replace(/[^a-z0-9_-]/gi,'')}),
    el('input',{value:o.name,placeholder:'이름',oninput:e=>o.name=e.target.value}),
    (()=>{const s=el('select',{onchange:e=>o.color=e.target.value});for(const c of COLORS)s.append(el('option',{value:c,class:'c-'+c},c));s.value=o.color||'gray';return s;})(),
    el('button',{class:'x','aria-label':'삭제',onclick:()=>{list.splice(list.indexOf(o),1);row.remove();}},'✕'));
  listEl.append(row);
}
let draft=null;
function openSettings(tab='conn'){
  draft=structuredClone(config);
  $('#sRepo').value=cfg.repo;$('#sBranch').value=cfg.branch;$('#sToken').value=cfg.token;
  const st=$('#optStatus');st.innerHTML='';for(const o of draft.statuses)optRow(draft.statuses,o,st);
  const lb=$('#optLabel');lb.innerHTML='';for(const o of draft.labels)optRow(draft.labels,o,lb);
  const vw=$('#optViews');vw.innerHTML='';
  for(const v of draft.views){const row=el('div',{class:'opt'},el('input',{value:v.name,oninput:e=>v.name=e.target.value}),el('span',{style:'font-size:12px;color:var(--fg2);flex:0 0 auto'},`${v.view}${v.folder?' · '+v.folder:''}`),el('button',{class:'x',onclick:()=>{draft.views.splice(draft.views.indexOf(v),1);row.remove();}},'✕'));vw.append(row);}
  if(!draft.views.length)vw.append(el('p',{},'저장된 뷰가 없습니다.'));
  settingsTab(tab);$('#settings').classList.add('on');
}
function settingsTab(t){document.querySelectorAll('#settings .mh button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));document.querySelectorAll('#settings .mb').forEach(p=>p.hidden=p.dataset.tab!==t);}
document.querySelectorAll('#settings .mh button').forEach(b=>b.onclick=()=>settingsTab(b.dataset.tab));
$('#addStatus').onclick=()=>{const o={id:'',name:'',color:'gray'};draft.statuses.push(o);optRow(draft.statuses,o,$('#optStatus'));};
$('#addLabel').onclick=()=>{const o={id:'',name:'',color:'gray'};draft.labels.push(o);optRow(draft.labels,o,$('#optLabel'));};
$('#btnSettings').onclick=()=>openSettings('conn');
$('#sCancel').onclick=()=>$('#settings').classList.remove('on');
$('#sSave').onclick=async()=>{
  const ncfg={repo:$('#sRepo').value.trim()||'harangon/drbrain',branch:$('#sBranch').value.trim()||'main',token:$('#sToken').value.trim()};
  const connChanged=JSON.stringify(ncfg)!==JSON.stringify(cfg);
  cfg=ncfg;localStorage.setItem(LS,JSON.stringify(cfg));
  draft.statuses=draft.statuses.filter(o=>o.id&&o.name);draft.labels=draft.labels.filter(o=>o.id&&o.name);
  const propsChanged=JSON.stringify(draft)!==JSON.stringify(config);
  $('#settings').classList.remove('on');
  if(connChanged){localStorage.removeItem('brain.cache');config=draft;await load();if(propsChanged)try{await saveConfig();}catch(e){toast('설정 저장 실패: '+e.message,4000);}return;}
  if(propsChanged){config=draft;try{await saveConfig();toast('설정을 저장했습니다');render();}catch(e){toast('설정 저장 실패: '+e.message,4000);}}
};

/* ===================== 커맨드 팔레트 ===================== */
let palItems=[],palIdx=0;
function palCommands(){
  const c=[{k:'새 메모',n:'Inbox에 빠른 메모',run:()=>{$('#quickText').focus();}}];
  for(const[f,t]of Object.entries(TEMPLATE_OF))c.push({k:'새 노트',n:`${f.replace(/^\d+_/,'')} (${t} 템플릿)`,run:()=>newFromTemplate(f)});
  for(const[v,name]of[['table','표'],['board','보드'],['gallery','갤러리'],['todo','할 일']])c.push({k:'뷰',n:name,run:()=>{state.view=v;render();}});
  for(const sv of config.views)c.push({k:'저장된 뷰',n:sv.name,run:()=>applyView(sv)});
  c.push({k:'동작',n:'새로고침 (캐시 비움)',run:()=>{localStorage.removeItem('brain.cache');load();}});
  c.push({k:'동작',n:'설정',run:()=>openSettings('conn')});
  return c;
}
function openPalette(){$('#palette').classList.add('on');$('#palInput').value='';palRender();setTimeout(()=>$('#palInput').focus(),30);}
function closePalette(){$('#palette').classList.remove('on');}
function palRender(){
  const q=$('#palInput').value.trim();const list=$('#palList');list.innerHTML='';palItems=[];palIdx=0;
  const cmdMode=q.startsWith('>');const qq=(cmdMode?q.slice(1):q).trim().toLowerCase();
  if(!cmdMode){
    const hits=notes.filter(n=>!qq||n.title.toLowerCase().includes(qq)||n.path.toLowerCase().includes(qq)).slice(0,qq?30:8);
    if(hits.length)list.append(el('div',{class:'sec'},qq?'노트':'최근 노트'));
    for(const n of hits)palItems.push({label:n.title,k:n.folder.replace(/^\d+_/,''),run:()=>openNote(n)});
    if(qq&&hits.length<30){list.append(el('div',{class:'sec'},'본문 검색'));
      for(const n of notes.filter(n=>!hits.includes(n)&&n.body.toLowerCase().includes(qq)).slice(0,10))palItems.push({label:n.title,k:'본문',run:()=>openNote(n)});}
  }
  const cmds=palCommands().filter(c=>!qq||(c.k+' '+c.n).toLowerCase().includes(qq));
  if(cmds.length&&(cmdMode||qq||!palItems.length)){list.append(el('div',{class:'sec'},'명령'));for(const c of cmds)palItems.push({label:c.n,k:c.k,run:c.run});}
  if(!palItems.length)list.append(el('div',{class:'sec'},'결과 없음'));
  palItems.forEach((it,i)=>list.append(el('button',{role:'option','aria-selected':i===palIdx?'true':'false',onclick:()=>{closePalette();it.run();},onmousemove:()=>{palIdx=i;palHi();}},el('span',{class:'k'},it.k),el('span',{class:'n'},it.label))));
}
function palHi(){$('#palList').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-selected',i===palIdx?'true':'false'));$('#palList').querySelector('[aria-selected=true]')?.scrollIntoView({block:'nearest'});}
$('#palInput').oninput=palRender;
$('#palInput').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,palItems.length-1);palHi();}else if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);palHi();}else if(e.key==='Enter'){e.preventDefault();const it=palItems[palIdx];if(it){closePalette();it.run();}}else if(e.key==='Escape')closePalette();};
$('#palette').onclick=e=>{if(e.target===$('#palette'))closePalette();};
$('#btnPalette').onclick=openPalette;
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#palette').classList.contains('on')?closePalette():openPalette();}});

/* ===================== 컨트롤 ===================== */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();});
['#fFolder','#fStatus','#fLabel','#fGroup'].forEach(s=>$(s).onchange=()=>{readControls();state.saved='';render();});
$('#q').oninput=()=>{readControls();render();};
$('#btnReload').onclick=()=>{localStorage.removeItem('brain.cache');load();};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{const c=JSON.parse(localStorage.getItem('brain.config')||'null');if(c)config={...structuredClone(DEFAULT_CONFIG),...c};}catch{}
applyConfig();
if(!cfg.token){$('#main').innerHTML='<div class="status">먼저 오른쪽 위 ⚙ 에서 GitHub 토큰을 입력하세요.</div>';openSettings('conn');}else load();
</script>
